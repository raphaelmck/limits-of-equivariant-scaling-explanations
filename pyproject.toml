[project]
name = "paper-repro"
version = "1.0.0"
description = "CPU-only analysis layer regenerating the paper's numbers and figures from frozen result tables."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
